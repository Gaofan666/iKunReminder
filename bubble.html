<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>pet-bubble</title>
<style>
  /* 独立的透明小窗：里头只有气泡本体，四周留一点余量给小尾巴。
     窗口逻辑尺寸和 --bubble-w/h 都由主进程按「物理尺寸 ÷ 屏幕缩放」算好传进来
     （main.js 的 bubbleBox()），所以这里的尺寸写法对 100%~200% 缩放都成立。 */
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;
  }
  /* 外层负责入场动画，内层负责按屏幕缩放放大 —— 两个 transform 分开写，
     否则动画的 transform 会把缩放覆盖掉（关键帧里写 var() 也不可靠）。 */
  #bubble{
    position:absolute;
    left:var(--bubble-pad,10px);top:var(--bubble-pad,10px);
    width:var(--bubble-w,340px);height:var(--bubble-h,176px);
    animation:bubbleIn .18s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes bubbleIn{ from{opacity:0;transform:translateY(6px) scale(.96)} to{opacity:1;transform:none} }

  #bubble-inner{
    position:relative;width:100%;height:100%;
    display:flex;flex-direction:column;gap:7px;
    padding:12px 14px;box-sizing:border-box;overflow:hidden;
    border-radius:16px;background:#ffffff;
    border:1px solid rgba(70,95,110,.22);
    transform-origin:top left;
    transform:scale(var(--bubble-scale,1));
  }

  .pb-head{font-size:16.5px;font-weight:800;letter-spacing:1px;color:#0F2027}
  .pb-mer{font-size:14px;font-weight:600;color:#1A6E80;letter-spacing:.5px}
  .pb-tip{font-size:14px;line-height:1.75;color:#2B3A44;flex:1;overflow:hidden}
  .pb-next{
    font-size:13px;font-weight:600;color:#A6522C;letter-spacing:.3px;
    padding-top:7px;border-top:1px solid rgba(74,120,150,.22);
  }
  /* 今日待办：只有真的有待办时才显示，气泡窗会按行数长高（main.js 算的） */
  .pb-todos{
    display:flex;flex-direction:column;gap:3px;
    padding-top:7px;border-top:1px solid rgba(74,120,150,.22);
  }
  .pb-todos[hidden]{display:none}
  .pb-todo-head{font-size:13.5px;font-weight:800;color:#1A6E80;letter-spacing:.5px}
  /* 备忘截止那一块的标题：暖色，和「今日待办」的青色区分开 */
  .pb-memo-head{color:#B8543F}
  .pb-todo-row{display:flex;gap:7px;align-items:baseline;font-size:13px;line-height:1.55;color:#2B3A44}
  .pb-todo-row .t{
    flex:none;font-weight:700;color:#A6522C;
    font-variant-numeric:tabular-nums;letter-spacing:.2px;
  }
  .pb-todo-row .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pb-todo-row.done .t{color:#8A9AA5}
  .pb-todo-row.done .x{color:#8A9AA5;text-decoration:line-through}
  .pb-todo-more{font-size:12.5px;line-height:1.5;color:#6E7E88}

  /* 小尾巴：共用同一个方块，靠旋转角度指四个方向。
     --tail 是内层坐标，内层有缩放，所以尾巴用 calc 反算回去，始终贴着气泡边。 */
  #bubble-inner::after{
    content:"";position:absolute;width:16px;height:16px;background:#ffffff;
    border-right:1px solid rgba(70,95,110,.22);
    border-bottom:1px solid rgba(70,95,110,.22);
    transform:rotate(45deg) scale(var(--bubble-inv,1));
  }
  body.tail-bottom #bubble-inner::after{bottom:calc(-9px / var(--bubble-scale,1));left:calc(var(--tail,36px) / var(--bubble-scale,1))}
  body.tail-top    #bubble-inner::after{top:calc(-9px / var(--bubble-scale,1));left:calc(var(--tail,36px) / var(--bubble-scale,1));transform:rotate(225deg) scale(var(--bubble-inv,1))}
  body.tail-left   #bubble-inner::after{left:calc(-9px / var(--bubble-scale,1));top:calc(var(--tail,36px) / var(--bubble-scale,1));transform:rotate(135deg) scale(var(--bubble-inv,1))}
  body.tail-right  #bubble-inner::after{right:calc(-9px / var(--bubble-scale,1));top:calc(var(--tail,36px) / var(--bubble-scale,1));transform:rotate(-45deg) scale(var(--bubble-inv,1))}
</style>
</head>
<body class="tail-bottom">
  <div id="bubble">
    <div id="bubble-inner">
      <div class="pb-head" id="head"></div>
      <div class="pb-mer" id="mer"></div>
      <div class="pb-tip" id="tip"></div>
      <div class="pb-todos" id="todos" hidden>
        <div class="pb-todo-head" id="todoHead"></div>
        <div id="todoList"></div>
      </div>
      <div class="pb-todos" id="memos" hidden>
        <div class="pb-todo-head pb-memo-head" id="memoHead"></div>
        <div id="memoList"></div>
      </div>
      <div class="pb-next" id="next"></div>
    </div>
  </div>
<script src="bubble.js"></script>
</body>
</html>
